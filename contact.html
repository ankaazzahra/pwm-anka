<div class="max-w-xl mx-auto py-10 px-4">
  
  <div class="mb-10 flex items-center gap-4 px-2">
    <h2 class="brand text-3xl md:text-4xl text-stone-800 italic">Sapa Anka 👋</h2>
    <div class="h-[1px] flex-grow bg-stone-200"></div>
  </div>

  <div class="bg-white rounded-[2.5rem] shadow-sm border border-stone-100 p-8 md:p-10 relative overflow-hidden">
    
    <div class="absolute top-[-20px] right-[-20px] w-16 h-16 bg-orange-50 rounded-full"></div>

    <form id="contactForm" class="space-y-5 relative z-10">
      
      <div>
        <label for="name" class="block text-[10px] font-black text-stone-400 uppercase tracking-widest mb-2 ml-4 text-left">Nama Lengkap</label>
        <input type="text" id="name" name="name" placeholder="Siapa nama kamu?" 
               class="w-full px-6 py-4 bg-stone-50 border border-stone-100 rounded-[1.8rem] focus:outline-none focus:ring-2 focus:ring-orange-200 focus:bg-white focus:border-orange-100 transition-all duration-300 text-stone-700 placeholder:text-stone-300">
        <small class="error-msg hidden mt-2 ml-4 text-[10px] font-bold text-rose-400 uppercase italic"></small>
      </div>

      <div>
        <label for="email" class="block text-[10px] font-black text-stone-400 uppercase tracking-widest mb-2 ml-4 text-left">Alamat Email</label>
        <input type="email" id="email" name="email" placeholder="contoh@email.com" 
               class="w-full px-6 py-4 bg-stone-50 border border-stone-100 rounded-[1.8rem] focus:outline-none focus:ring-2 focus:ring-orange-200 focus:bg-white focus:border-orange-100 transition-all duration-300 text-stone-700 placeholder:text-stone-300">
        <small class="error-msg hidden mt-2 ml-4 text-[10px] font-bold text-rose-400 uppercase italic"></small>
      </div>

      <div>
        <label for="message" class="block text-[10px] font-black text-stone-400 uppercase tracking-widest mb-2 ml-4 text-left">Pesan</label>
        <textarea id="message" name="message" rows="4" placeholder="Tulis sesuatu yang manis..." 
                  class="w-full px-6 py-4 bg-stone-50 border border-stone-100 rounded-[1.8rem] focus:outline-none focus:ring-2 focus:ring-orange-200 focus:bg-white focus:border-orange-100 transition-all duration-300 text-stone-700 placeholder:text-stone-300 resize-none"></textarea>
        <small class="error-msg hidden mt-2 ml-4 text-[10px] font-bold text-rose-400 uppercase italic"></small>
      </div>

      <button type="submit" id="btnKirim"
              class="w-full py-4 bg-stone-800 text-white text-[10px] font-black uppercase tracking-[0.3em] rounded-[1.8rem] shadow-lg shadow-stone-200 hover:bg-stone-700 hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2">
        Kirim Pesan ✨
      </button>
    </form>

    <div id="successMsg" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm z-20 flex flex-col items-center justify-center p-8 text-center animate-fade-in">
      <div class="w-20 h-20 bg-orange-50 text-orange-400 rounded-full flex items-center justify-center text-4xl mb-4 animate-bounce">
        💌
      </div>
      <h3 class="brand text-2xl text-stone-800 italic mb-2">Terima Kasih!</h3>
      <p class="text-stone-400 text-xs leading-relaxed">Pesanmu sudah Anka terima.<br>Ditunggu ya balasannya!</p>
      
      <button type="button" id="btnKirimLagi" class="mt-6 text-[10px] font-black text-stone-400 uppercase border-b border-stone-100 hover:text-stone-800 hover:border-stone-300 transition-colors pt-2">Kirim pesan lain</button>
    </div>

  </div>
</div>
